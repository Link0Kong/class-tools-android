#   release 构建默认 → cloudbase（2026-11-23 备案已通过、https://tool.furina.fun 可用；
#                     REST 后端切流属 P4 数据迁移，本次未改默认档）
# 2026-11-23 备案通过后：P4 切流时用 --project-prop "ct.restProfile=selfhosted"，或改 build.gradle.kts 默认值。
