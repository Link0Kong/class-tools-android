# 2026-11-18 自建后端切流（P3）：切换/回滚/备案后发布见 deploy/migration/CLIENTS.md
# 三档 REST base（cloudbase / staging / selfhosted）与 ECS 服务地址按 buildType 区分：
#   debug   构建默认 → staging（http://121.196.47.2/v1/rdb/rest-next/，仅调试用）
#   release 构建默认 → cloudbase（2026-11-19 起；tool.furina.fun 备案暂停/DNS 未解析，
#                     selfhosted 会让 release 的通知/登录全部 DNS 失败）
# 备案 + HTTPS 恢复后：-Pct.restProfile=selfhosted，或把 build.gradle.kts 的 release 默认改回 selfhosted。
# 强制某档：ct.restProfile=cloudbase / staging / selfhosted
# 显式 URL 覆盖（优先级最高；ct.restBaseUrl 改成非默认值 = 两种构建都用它，保持旧部署脚本兼容）：
#   ct.restBaseUrlDebug / ct.restBaseUrlRelease（按 buildType 覆盖）
#   ct.restBase.cloudbase / ct.restBase.staging / ct.restBase.selfhosted（三档地址可改）
# 发布前安全闸门：.\gradlew.bat :app:verifyReleaseEndpoints
#   （release 的 REST/账号/云空间/更新/地图地址必须 https 且不含 121.196.47.2 明文 IP）
# 注意（2026-11-19）：release 默认已改为 CloudBase 网关，备案暂停期也可发布；tool.furina.fun
#       恢复解析 + HTTPS 后，用 -Pct.restProfile=selfhosted 或改 build.gradle.kts 默认值切回。
# ============================================================================
ct.restProfile=
ct.restBase.staging=http://121.196.47.2/v1/rdb/rest-next/
ct.restBase.selfhosted=https://tool.furina.fun/v1/rdb/rest/


